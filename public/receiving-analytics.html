<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receiving Analytics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#08080e;--surface:#0d0d16;--card:#111120;--border:#1e1e36;
  --text:#d0d0e0;--dim:#6a6a8a;--accent:#5b8aff;--accent2:#7c5bff;
  --warn:#f0a030;--danger:#e05555;--ok:#40c878;
}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;}
/* ── Login Gate ── */
#loginGate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;}
#loginGate h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#loginGate p{color:var(--dim);font-size:13px;margin-bottom:8px;}
#loginGate input{padding:12px 18px;font-size:16px;font-family:'JetBrains Mono',monospace;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);width:280px;outline:none;text-align:center;}
#loginGate input:focus{border-color:var(--accent);}
#loginGate button{padding:10px 32px;font-size:15px;font-family:'Syne',sans-serif;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;cursor:pointer;}
#loginGate button:hover{opacity:.9;}
#loginErr{color:var(--danger);font-size:12px;display:none;}
/* ── Main Dashboard ── */
#dashboard{display:none;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
.topbar h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar .meta{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--dim);}
.topbar .badge{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;}
.badge-admin{background:rgba(91,138,255,.15);color:var(--accent);}
.badge-viewer{background:rgba(240,160,48,.15);color:var(--warn);}
.tabs{display:flex;gap:0;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{padding:12px 24px;font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel{display:none;padding:20px 24px;}
.panel.active{display:block;}
/* ── Controls Bar ── */
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.controls select,.controls input[type="date"],.controls input[type="text"]{
  padding:7px 12px;font-size:13px;font-family:'JetBrains Mono',monospace;
  background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;
}
.controls select:focus,.controls input:focus{border-color:var(--accent);}
.btn{padding:8px 16px;font-size:13px;font-family:'Syne',sans-serif;font-weight:600;border:none;border-radius:6px;cursor:pointer;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-warn{background:linear-gradient(135deg,var(--warn),#e08020);color:#fff;}
.btn-ok{background:linear-gradient(135deg,var(--ok),#30a060);color:#fff;}
.btn-dim{background:var(--card);border:1px solid var(--border);color:var(--dim);}
.btn-danger{background:var(--danger);color:#fff;}
.spacer{flex:1;}
/* ── Stats Row ── */
.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;min-width:160px;flex:1;}
.stat-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.stat-card .value.blue{color:var(--accent);}
.stat-card .value.amber{color:var(--warn);}
.stat-card .value.green{color:var(--ok);}
.stat-card .value.purple{color:var(--accent2);}
/* ── Table ── */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{position:sticky;top:0;background:var(--surface);padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;}
thead th:hover{color:var(--accent);}
thead th .arrow{margin-left:4px;font-size:10px;}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;max-width:300px;overflow:hidden;text-overflow:ellipsis;}
tbody tr:hover{background:rgba(91,138,255,.04);}
tbody tr:last-child td{border-bottom:none;}
.issue-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin:1px 2px;background:rgba(240,160,48,.12);color:var(--warn);border:1px solid rgba(240,160,48,.2);}
.issue-tag.sur{background:rgba(224,85,85,.12);color:#f08080;border-color:rgba(224,85,85,.2);}
.issue-tag.fp{background:rgba(240,120,40,.12);color:#f0a060;border-color:rgba(240,120,40,.2);}
.issue-tag.ph{background:rgba(85,180,224,.12);color:#80c8f0;border-color:rgba(85,180,224,.2);}
.issue-tag.sn{background:rgba(144,112,208,.12);color:#c0a0f0;border-color:rgba(144,112,208,.2);}
.issue-tag.wt{background:rgba(48,200,120,.12);color:#60e090;border-color:rgba(48,200,120,.2);}
.issue-tag.hz{background:rgba(200,200,60,.12);color:#d0d060;border-color:rgba(200,200,60,.2);}
.issue-tag.mi{background:rgba(91,138,255,.12);color:#80a8f0;border-color:rgba(91,138,255,.2);}
.empty{padding:40px;text-align:center;color:var(--dim);font-size:14px;}
.detail-text{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5;white-space:pre-wrap;max-height:3.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.row-actions{display:flex;gap:6px;white-space:nowrap;}
.row-actions button{padding:4px 8px;font-size:11px;font-family:'JetBrains Mono',monospace;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--surface);color:var(--dim);transition:all .15s;}
.row-actions button:hover{color:var(--text);border-color:var(--dim);}
.row-actions button.del:hover{color:var(--danger);border-color:var(--danger);}
/* Edit modal */
.edit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.edit-overlay.open{display:flex;}
.edit-modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:500px;max-width:95vw;max-height:85vh;overflow-y:auto;}
.edit-modal h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text);}
.edit-modal label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;}
.edit-modal input,.edit-modal textarea{width:100%;padding:8px 12px;font-size:13px;font-family:'JetBrains Mono',monospace;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;}
.edit-modal input:focus,.edit-modal textarea:focus{border-color:var(--accent);}
.edit-modal textarea{min-height:80px;resize:vertical;}
.edit-modal .edit-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
/* ── Responsive ── */
@media(max-width:768px){
  .topbar{padding:12px 16px;flex-wrap:wrap;gap:8px;}
  .tabs{padding:0 12px;overflow-x:auto;}
  .panel{padding:14px 12px;}
  .stats{gap:10px;}
  .stat-card{min-width:120px;padding:12px 14px;}
  .controls{gap:8px;}
}
</style>
</head>
<body>

<!-- ── Dashboard ── -->
<div id="dashboard" style="display:block;">
  <div class="topbar">
    <h1>📊 Receiving Analytics</h1>
    <div class="meta">
      <span id="fbConnStatus" style="color:var(--dim)">● Connecting…</span>
      <span id="accessBadge" class="badge badge-viewer">VIEWER</span>
      <input type="password" id="adminPwField" placeholder="Admin password" style="padding:4px 10px;font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);width:130px;outline:none;" onkeydown="if(event.key==='Enter')unlockAdmin()">
      <button class="btn btn-dim" onclick="unlockAdmin()" id="adminUnlockBtn" style="padding:5px 12px;font-size:11px;">🔓 Unlock</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('offspec',this)">Offspec Submissions</div>
    <div class="tab" onclick="switchTab('email',this)">Email Log</div>
  </div>

  <!-- ── OFFSPEC PANEL ── -->
  <div class="panel active" id="panel-offspec">
    <div class="stats" id="offspecStats"></div>
    <div class="controls">
      <input type="text" id="filterGenerator" placeholder="Search generator…" oninput="renderOffspec()" style="width:180px;">
      <input type="text" id="filterWasteStream" placeholder="Search waste stream…" oninput="renderOffspec()" style="width:180px;">
      <input type="date" id="filterDateFrom" onchange="renderOffspec()" title="From date">
      <input type="date" id="filterDateTo" onchange="renderOffspec()" title="To date">
      <span class="spacer"></span>
      <button class="btn btn-dim" onclick="clearFilters('offspec')">Clear Filters</button>
      <button class="btn btn-ok" onclick="exportCSV('offspec')">⬇ CSV</button>
      <button class="btn btn-accent" onclick="exportJSON('offspec')">⬇ JSON (Claude)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="offspecThead"></thead>
        <tbody id="offspecTbody"></tbody>
      </table>
    </div>
    <div id="offspecEmpty" class="empty" style="display:none;">No records yet. Offspec submissions will appear here automatically.</div>
  </div>

  <!-- ── EMAIL PANEL ── -->
  <div class="panel" id="panel-email">
    <div class="stats" id="emailStats"></div>
    <div class="controls">
      <select id="filterEmailType" onchange="renderEmail()">
        <option value="">All Templates</option>
      </select>
      <select id="filterEmailAction" onchange="renderEmail()">
        <option value="">All Actions</option>
        <option value="copy">Copy</option>
        <option value="outlook">Outlook App</option>
        <option value="owa">Outlook Web</option>
      </select>
      <input type="text" id="filterEmailSearch" placeholder="Search subject/body…" oninput="renderEmail()" style="width:200px;">
      <input type="date" id="filterEmailFrom" onchange="renderEmail()" title="From date">
      <input type="date" id="filterEmailTo" onchange="renderEmail()" title="To date">
      <span class="spacer"></span>
      <button class="btn btn-dim" onclick="clearFilters('email')">Clear Filters</button>
      <button class="btn btn-ok" onclick="exportCSV('email')">⬇ CSV</button>
      <button class="btn btn-accent" onclick="exportJSON('email')">⬇ JSON (Claude)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="emailThead"></thead>
        <tbody id="emailTbody"></tbody>
      </table>
    </div>
    <div id="emailEmpty" class="empty" style="display:none;">No records yet. Email actions will appear here automatically.</div>
  </div>

  <!-- Edit Modal -->
  <div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
    <div class="edit-modal">
      <h3 id="editTitle">Edit Record</h3>
      <input type="hidden" id="editId">
      <label>Received Date</label>
      <input type="text" id="editReceived" placeholder="mm/dd/yyyy">
      <label>Load #</label>
      <input type="text" id="editLoad">
      <label>Sales Order</label>
      <input type="text" id="editSO">
      <label>Manifest</label>
      <input type="text" id="editManifest">
      <label>Generator / Customer</label>
      <input type="text" id="editGenerator">
      <label>Waste Stream / Profile</label>
      <input type="text" id="editWasteStream">
      <label>Misc Descriptions (one per line)</label>
      <textarea id="editMisc"></textarea>
      <div class="edit-btns">
        <button class="btn btn-dim" onclick="closeEdit()">Cancel</button>
        <button class="btn btn-accent" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Configuration ──
var ADMIN_PW="dfetter";
var ANALYTICS_PW="analytics2025"; // Separate read-only password for managers
var accessLevel=""; // "admin" or "viewer"

var FIREBASE_CFG={
  apiKey:"AIzaSyDIGaQ4pCQh87axYflOMcj6-B5p_AwF_kg",
  authDomain:"ec-receiving.firebaseapp.com",
  projectId:"ec-receiving",
  storageBucket:"ec-receiving.firebasestorage.app",
  messagingSenderId:"1014911293414",
  appId:"1:1014911293414:web:7fe5896b07fc800d2aa827"
};

var db=null;
var offspecData=[];
var emailData=[];
var offspecSort={col:"receivedDate",dir:-1};
var emailSort={col:"timestamp",dir:-1};

// Issue code label map
var ISSUE_LABELS={sur:"Surcharge",fp:"Flash Point",ph:"pH",sn:"Shipping Name",wt:"Weight",hz:"Haz Code",mi:"Misc"};

// ── Admin Unlock ──
function unlockAdmin(){
  var pw=document.getElementById("adminPwField").value;
  if(pw===ADMIN_PW){
    accessLevel="admin";
    var badge=document.getElementById("accessBadge");
    badge.textContent="ADMIN";badge.className="badge badge-admin";
    document.getElementById("adminPwField").style.display="none";
    document.getElementById("adminUnlockBtn").textContent="🔓 Admin";
    document.getElementById("adminUnlockBtn").onclick=function(){lockAdmin();};
    renderOffspec();renderEmail();
  }else{
    document.getElementById("adminPwField").value="";
    document.getElementById("adminPwField").style.borderColor="var(--danger)";
    setTimeout(function(){document.getElementById("adminPwField").style.borderColor="";},1500);
  }
}
function lockAdmin(){
  accessLevel="viewer";
  var badge=document.getElementById("accessBadge");
  badge.textContent="VIEWER";badge.className="badge badge-viewer";
  document.getElementById("adminPwField").style.display="";
  document.getElementById("adminPwField").value="";
  document.getElementById("adminUnlockBtn").textContent="🔓 Unlock";
  document.getElementById("adminUnlockBtn").onclick=function(){unlockAdmin();};
  renderOffspec();renderEmail();
}

// ── Start Dashboard (auto on load) ──
function startDashboard(){
  initFirebase();
}

// ── Firebase Init ──
function initFirebase(){
  function loadScript(src,cb){
    var s=document.createElement("script");s.src=src;s.onload=cb;
    s.onerror=function(){document.getElementById("fbConnStatus").textContent="● Firebase failed";document.getElementById("fbConnStatus").style.color="#f44336";};
    document.head.appendChild(s);
  }
  loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js",function(){
    loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js",function(){
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CFG);
      db=firebase.firestore();
      document.getElementById("fbConnStatus").textContent="● Connected";
      document.getElementById("fbConnStatus").style.color="#4caf50";
      startListeners();
    });
  });
}

// ── Real-time Listeners ──
function startListeners(){
  // Offspec submissions
  db.collection("offspec_submissions").orderBy("timestamp","desc").onSnapshot(function(snap){
    offspecData=[];
    snap.forEach(function(doc){
      var d=doc.data();d._id=doc.id;offspecData.push(d);
    });
    renderOffspec();
  },function(err){console.error("Offspec listener error:",err);});

  // Email submissions
  db.collection("email_submissions").orderBy("timestamp","desc").onSnapshot(function(snap){
    emailData=[];
    snap.forEach(function(doc){
      var d=doc.data();d._id=doc.id;emailData.push(d);
    });
    populateEmailTypeFilter();
    renderEmail();
  },function(err){console.error("Email listener error:",err);});
}

// ── Tab Switching ──
function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
  el.classList.add("active");
  document.getElementById("panel-"+tab).classList.add("active");
}

// ── OFFSPEC Rendering ──
function getFilteredOffspec(){
  var gen=(document.getElementById("filterGenerator").value||"").toLowerCase();
  var ws=(document.getElementById("filterWasteStream").value||"").toLowerCase();
  var from=document.getElementById("filterDateFrom").value;
  var to=document.getElementById("filterDateTo").value;
  return offspecData.filter(function(r){
    if(gen&&(r.generator||"").toLowerCase().indexOf(gen)===-1)return false;
    if(ws){
      var hasWs=false;
      (r.lineItems||[]).forEach(function(li){if((li.wasteStream||"").toLowerCase().indexOf(ws)!==-1)hasWs=true;});
      if(!hasWs)return false;
    }
    if(from){var ts=new Date(r.timestamp).toISOString().split("T")[0];if(ts<from)return false;}
    if(to){var ts2=new Date(r.timestamp).toISOString().split("T")[0];if(ts2>to)return false;}
    return true;
  });
}

function renderOffspec(){
  var filtered=getFilteredOffspec();
  // Stats
  var genCounts={},miscCounts={};
  filtered.forEach(function(r){
    var g=(r.generator||"UNKNOWN").toUpperCase();genCounts[g]=(genCounts[g]||0)+1;
    (r.issues||[]).forEach(function(i){
      if(i.code==="mi"&&i.details){
        i.details.forEach(function(d){if(d.trim())miscCounts[d.trim()]=(miscCounts[d.trim()]||0)+1;});
      }
    });
  });
  var topGen="—",topGenN=0;
  for(var g in genCounts){if(genCounts[g]>topGenN){topGenN=genCounts[g];topGen=g;}}
  var topMisc="—",topMiscN=0;
  for(var m in miscCounts){if(miscCounts[m]>topMiscN){topMiscN=miscCounts[m];topMisc=m;}}
  var miscTotal=0;for(var mx in miscCounts){miscTotal+=miscCounts[mx];}

  document.getElementById("offspecStats").innerHTML=
    '<div class="stat-card"><div class="label">Total Records</div><div class="value blue">'+filtered.length+'</div></div>'+
    '<div class="stat-card"><div class="label">Top Generator</div><div class="value amber">'+(topGen.length>20?topGen.substring(0,20)+'…':topGen)+(topGenN?' ('+topGenN+')':'')+'</div></div>'+
    '<div class="stat-card"><div class="label">Unique Generators</div><div class="value purple">'+Object.keys(genCounts).length+'</div></div>'+
    '<div class="stat-card"><div class="label">Misc Issues Logged</div><div class="value green">'+miscTotal+'</div></div>';

  // Sort
  filtered.sort(function(a,b){
    var va=getNestedVal(a,offspecSort.col),vb=getNestedVal(b,offspecSort.col);
    if(va<vb)return -1*offspecSort.dir;if(va>vb)return 1*offspecSort.dir;return 0;
  });

  // Header
  var cols=[
    {key:"receivedDate",label:"Received"},
    {key:"loadNumber",label:"Load #"},
    {key:"salesOrder",label:"Sales Order"},
    {key:"manifest",label:"Manifest"},
    {key:"generator",label:"Generator / Customer"},
    {key:"_wasteStreams",label:"Waste Stream / Profile"},
    {key:"_processCodes",label:"Process Code"},
    {key:"_miscDesc",label:"Misc Descriptions"},
    {key:"_actions",label:""}
  ];
  var thead=document.getElementById("offspecThead");
  thead.innerHTML="<tr>"+cols.map(function(c){
    if(c.key==="_actions")return '<th style="width:80px;"></th>';
    var arrow=offspecSort.col===c.key?(offspecSort.dir===1?"▲":"▼"):"";
    return '<th onclick="sortOffspec(\''+c.key+'\')">'+c.label+'<span class="arrow">'+arrow+'</span></th>';
  }).join("")+"</tr>";

  // Body
  var tbody=document.getElementById("offspecTbody");
  if(filtered.length===0){
    tbody.innerHTML="";
    document.getElementById("offspecEmpty").style.display="block";
    return;
  }
  document.getElementById("offspecEmpty").style.display="none";
  tbody.innerHTML=filtered.map(function(r){
    // Extract waste streams from line items
    var wsArr=(r.lineItems||[]).map(function(li){return li.wasteStream||"";}).filter(Boolean);
    var wsStr=wsArr.length?wsArr.join(", "):"—";
    // Extract process codes
    var pcArr=(r.lineItems||[]).map(function(li){return li.processCode||"";}).filter(Boolean);
    var pcStr=pcArr.length?pcArr.filter(function(v,i,a){return a.indexOf(v)===i;}).join(", "):"—";
    // Extract miscellaneous descriptions specifically
    var miscLines=[];
    (r.issues||[]).forEach(function(i){
      if(i.code==="mi"&&i.details&&i.details.length){
        i.details.forEach(function(d){if(d.trim())miscLines.push(d.trim());});
      }
    });
    var miscStr=miscLines.join("\n");
    return '<tr style="cursor:pointer" onclick="showOffspecDetail(\''+r._id+'\')">' +
      "<td>"+(r.receivedDate||"—")+"</td>"+
      "<td>"+(r.loadNumber||"—")+"</td>"+
      "<td>"+(r.salesOrder||"—")+"</td>"+
      "<td>"+(r.manifest||"—")+"</td>"+
      "<td>"+(r.generator||"—")+"</td>"+
      "<td>"+escHtml(wsStr)+"</td>"+
      "<td>"+escHtml(pcStr)+"</td>"+
      "<td>"+(miscStr?'<div class="detail-text">'+escHtml(miscStr)+'</div>':"—")+"</td>"+
      '<td style="white-space:nowrap;" onclick="event.stopPropagation()">'+(accessLevel==="admin"?'<button onclick="openEdit(\''+r._id+'\')" class="btn btn-accent" style="padding:3px 8px;font-size:11px;margin-right:4px;">✏️</button><button onclick="deleteRecord(\''+r._id+'\')" class="btn btn-warn" style="padding:3px 8px;font-size:11px;">🗑</button>':'')+'</td>'+
    "</tr>";
  }).join("");
}

function sortOffspec(col){
  if(offspecSort.col===col)offspecSort.dir*=-1;
  else{offspecSort.col=col;offspecSort.dir=-1;}
  renderOffspec();
}

// ── EMAIL Rendering ──
function populateEmailTypeFilter(){
  var types={};emailData.forEach(function(r){if(r.templateType)types[r.templateType]=true;});
  var sel=document.getElementById("filterEmailType");
  var cur=sel.value;
  sel.innerHTML='<option value="">All Templates</option>'+Object.keys(types).sort().map(function(t){
    return '<option value="'+escHtml(t)+'">'+escHtml(t)+'</option>';
  }).join("");
  sel.value=cur;
}

function getFilteredEmail(){
  var typ=document.getElementById("filterEmailType").value;
  var act=document.getElementById("filterEmailAction").value;
  var search=(document.getElementById("filterEmailSearch").value||"").toLowerCase();
  var from=document.getElementById("filterEmailFrom").value;
  var to=document.getElementById("filterEmailTo").value;
  return emailData.filter(function(r){
    if(typ&&r.templateType!==typ)return false;
    if(act&&r.action!==act)return false;
    if(search){
      var hay=((r.subject||"")+" "+(r.body||"")).toLowerCase();
      if(hay.indexOf(search)===-1)return false;
    }
    if(from){var ts=new Date(r.timestamp).toISOString().split("T")[0];if(ts<from)return false;}
    if(to){var ts2=new Date(r.timestamp).toISOString().split("T")[0];if(ts2>to)return false;}
    return true;
  });
}

function renderEmail(){
  var filtered=getFilteredEmail();
  // Stats
  var typeCounts={},actionCounts={};
  filtered.forEach(function(r){
    typeCounts[r.templateType||"unknown"]=(typeCounts[r.templateType||"unknown"]||0)+1;
    actionCounts[r.action||"unknown"]=(actionCounts[r.action||"unknown"]||0)+1;
  });
  var topType="—",topTypeN=0;
  for(var k in typeCounts){if(typeCounts[k]>topTypeN){topTypeN=typeCounts[k];topType=k;}}

  document.getElementById("emailStats").innerHTML=
    '<div class="stat-card"><div class="label">Total Emails</div><div class="value blue">'+filtered.length+'</div></div>'+
    '<div class="stat-card"><div class="label">Most Used Template</div><div class="value amber">'+escHtml(topType)+(topTypeN?' ('+topTypeN+')':'')+'</div></div>'+
    '<div class="stat-card"><div class="label">Copies</div><div class="value green">'+(actionCounts.copy||0)+'</div></div>'+
    '<div class="stat-card"><div class="label">Outlook / OWA</div><div class="value purple">'+((actionCounts.outlook||0)+(actionCounts.owa||0))+'</div></div>';

  // Sort
  filtered.sort(function(a,b){
    var va=getNestedVal(a,emailSort.col),vb=getNestedVal(b,emailSort.col);
    if(va<vb)return -1*emailSort.dir;if(va>vb)return 1*emailSort.dir;return 0;
  });

  // Header
  var cols=[
    {key:"timestamp",label:"Date/Time"},
    {key:"templateType",label:"Template"},
    {key:"action",label:"Action"},
    {key:"subject",label:"Subject"},
    {key:"body",label:"Body (preview)"},
    {key:"_actions",label:""}
  ];
  var thead=document.getElementById("emailThead");
  thead.innerHTML="<tr>"+cols.map(function(c){
    if(c.key==="_actions")return '<th style="width:70px;"></th>';
    var arrow=emailSort.col===c.key?(emailSort.dir===1?"▲":"▼"):"";
    return '<th onclick="sortEmail(\''+c.key+'\')">'+c.label+'<span class="arrow">'+arrow+'</span></th>';
  }).join("")+"</tr>";

  // Body
  var tbody=document.getElementById("emailTbody");
  if(filtered.length===0){
    tbody.innerHTML="";
    document.getElementById("emailEmpty").style.display="block";
    return;
  }
  document.getElementById("emailEmpty").style.display="none";
  tbody.innerHTML=filtered.map(function(r){
    var dt=r.timestamp?new Date(r.timestamp):"";
    var dateStr=dt?dt.toLocaleString("en-US",{timeZone:"America/Chicago",month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true})+" CT":"—";
    var bodyPreview=(r.body||"").substring(0,200).replace(/\n/g," ");
    if((r.body||"").length>200)bodyPreview+="…";
    var actionLabel={copy:"📋 Copy",outlook:"📧 Outlook",owa:"🌐 OWA"}[r.action]||r.action;
    var rid=r._id||"";
    return "<tr>"+
      "<td>"+dateStr+"</td>"+
      "<td>"+escHtml(r.templateType||"—")+"</td>"+
      "<td>"+actionLabel+"</td>"+
      "<td>"+escHtml(r.subject||"—")+"</td>"+
      "<td>"+'<div class="detail-text">'+escHtml(bodyPreview)+'</div>'+"</td>"+
      '<td style="white-space:nowrap;">'+(accessLevel==="admin"?'<button onclick="editEmailEntry(\''+rid+'\')" class="btn btn-accent" style="padding:3px 8px;font-size:11px;margin-right:4px;">✏️</button><button onclick="deleteEmailEntry(\''+rid+'\')" class="btn btn-warn" style="padding:3px 8px;font-size:11px;">🗑</button>':'')+'</td>'+
    "</tr>";
  }).join("");
}

function sortEmail(col){
  if(emailSort.col===col)emailSort.dir*=-1;
  else{emailSort.col=col;emailSort.dir=-1;}
  renderEmail();
}

// ── Filters ──
function clearFilters(type){
  if(type==="offspec"){
    document.getElementById("filterGenerator").value="";
    document.getElementById("filterWasteStream").value="";
    document.getElementById("filterDateFrom").value="";
    document.getElementById("filterDateTo").value="";
    renderOffspec();
  }else{
    document.getElementById("filterEmailType").value="";
    document.getElementById("filterEmailAction").value="";
    document.getElementById("filterEmailSearch").value="";
    document.getElementById("filterEmailFrom").value="";
    document.getElementById("filterEmailTo").value="";

}

// ── Exports ──
function exportJSON(type){
  var data,filename;
  if(type==="offspec"){
    data=getFilteredOffspec();
    filename="offspec_analytics_"+todayStr()+".json";
  }else{
    data=getFilteredEmail();
    filename="email_analytics_"+todayStr()+".json";
  }
  // Clean internal fields
  var clean=data.map(function(r){var o={};for(var k in r){if(k!=="_id")o[k]=r[k];}return o;});
  var blob=new Blob([JSON.stringify(clean,null,2)],{type:"application/json"});
  downloadBlob(blob,filename);
}

function exportCSV(type){
  var data,filename,headers;
  if(type==="offspec"){
    data=getFilteredOffspec();
    filename="offspec_analytics_"+todayStr()+".csv";
    headers=["ReceivedDate","LoadNumber","SalesOrder","Manifest","Generator","WasteStream","MiscDescriptions"];
    var rows=data.map(function(r){
      var ws=(r.lineItems||[]).map(function(li){return li.wasteStream;}).filter(Boolean).join("|");
      var miscLines=[];
      (r.issues||[]).forEach(function(i){
        if(i.code==="mi"&&i.details)i.details.forEach(function(d){if(d.trim())miscLines.push(d.trim());});
      });
      return [r.receivedDate,r.loadNumber,r.salesOrder,r.manifest,r.generator,ws,miscLines.join(" | ")];
    });
    downloadCSV(headers,rows,filename);
  }else{
    data=getFilteredEmail();
    filename="email_analytics_"+todayStr()+".csv";
    headers=["Date","Template","Action","Subject","Body"];
    var rows2=data.map(function(r){
      var dt=r.timestamp?new Date(r.timestamp).toISOString():"";
      return [dt,r.templateType,r.action,r.subject,(r.body||"").substring(0,2000)];
    });
    downloadCSV(headers,rows2,filename);
  }
}

function downloadCSV(headers,rows,filename){
  var csvContent=headers.join(",")+"\n"+rows.map(function(row){
    return row.map(function(cell){return '"'+String(cell||"").replace(/"/g,'""')+'"';}).join(",");
  }).join("\n");
  var blob=new Blob([csvContent],{type:"text/csv;charset=utf-8;"});
  downloadBlob(blob,filename);
}

function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;
  a.click();URL.revokeObjectURL(url);
}

// ── Edit / Delete ──
function openEdit(id){
  var r=null;
  offspecData.forEach(function(d){if(d._id===id)r=d;});
  if(!r)return;
  document.getElementById("editId").value=id;
  document.getElementById("editReceived").value=r.receivedDate||"";
  document.getElementById("editLoad").value=r.loadNumber||"";
  document.getElementById("editSO").value=r.salesOrder||"";
  document.getElementById("editManifest").value=r.manifest||"";
  document.getElementById("editGenerator").value=r.generator||"";
  // Waste streams
  var wsArr=(r.lineItems||[]).map(function(li){return li.wasteStream||"";}).filter(Boolean);
  document.getElementById("editWasteStream").value=wsArr.join(", ");
  // Misc descriptions
  var miscLines=[];
  (r.issues||[]).forEach(function(i){
    if(i.code==="mi"&&i.details)i.details.forEach(function(d){if(d.trim())miscLines.push(d.trim());});
  });
  document.getElementById("editMisc").value=miscLines.join("\n");
  document.getElementById("editOverlay").classList.add("open");
}

function closeEdit(){
  document.getElementById("editOverlay").classList.remove("open");
}

function saveEdit(){
  if(!db)return;
  var id=document.getElementById("editId").value;
  if(!id)return;
  // Find original record to preserve fields we don't edit
  var orig=null;
  offspecData.forEach(function(d){if(d._id===id)orig=d;});
  if(!orig)return;
  // Build updated fields
  var wsInput=document.getElementById("editWasteStream").value.trim();
  var wsItems=wsInput?wsInput.split(/\s*,\s*/).map(function(ws){return{page:"",line:"",wasteStream:ws};}):[];
  var miscInput=document.getElementById("editMisc").value.trim();
  var miscDetails=miscInput?miscInput.split("\n").filter(function(l){return l.trim();}).map(function(l){return l.trim();}):[];
  // Rebuild issues array — preserve non-misc issues, update misc
  var newIssues=(orig.issues||[]).filter(function(i){return i.code!=="mi";});
  if(miscDetails.length){
    newIssues.push({code:"mi",label:"Miscellaneous",details:miscDetails});
  }
  var update={
    receivedDate:document.getElementById("editReceived").value.trim(),
    loadNumber:document.getElementById("editLoad").value.trim(),
    salesOrder:document.getElementById("editSO").value.trim(),
    manifest:document.getElementById("editManifest").value.trim(),
    generator:document.getElementById("editGenerator").value.trim(),
    lineItems:wsItems,
    issues:newIssues
  };
  db.collection("offspec_submissions").doc(id).update(update).then(function(){
    closeEdit();
  }).catch(function(e){
    alert("Save failed: "+e.message);
  });
}

function deleteRecord(id){
  if(!db)return;
  if(!confirm("Delete this record permanently?"))return;
  db.collection("offspec_submissions").doc(id).delete().catch(function(e){
    alert("Delete failed: "+e.message);
  });
}

function deleteEmailEntry(id){
  if(!db||!id)return;
  if(!confirm("Delete this email log entry permanently?"))return;
  db.collection("email_submissions").doc(id).delete().catch(function(e){
    alert("Delete failed: "+e.message);
  });
}

function saveEmailEdit(id){
  if(!db)return;
  var update={
    templateType:document.getElementById("eeType").value.trim(),
    subject:document.getElementById("eeSubject").value.trim(),
    body:document.getElementById("eeBody").value.trim()
  };
  db.collection("email_submissions").doc(id).update(update).then(function(){
    var modal=document.getElementById("emailEditModal");if(modal)modal.remove();
  }).catch(function(e){
    alert("Save failed: "+e.message);
  });
}

// ── Helpers ──
function getNestedVal(obj,key){
  if(key==="_issues")return(obj.issues||[]).length;
  if(key==="_details")return((obj.issues||[])[0]||{}).code||"";
  if(key==="_wasteStreams"){
    return(obj.lineItems||[]).map(function(li){return li.wasteStream||"";}).filter(Boolean).join(", ");
  }
  if(key==="_processCodes"){
    return(obj.lineItems||[]).map(function(li){return li.processCode||"";}).filter(Boolean).join(", ");
  }
  if(key==="_miscDesc"){
    var parts=[];
    (obj.issues||[]).forEach(function(i){if(i.code==="mi"&&i.details)i.details.forEach(function(d){if(d.trim())parts.push(d.trim());});});
    return parts.join(" ");
  }
  return obj[key]||"";
}
function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
