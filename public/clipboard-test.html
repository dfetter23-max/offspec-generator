<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Quick Check — Receiving Tools</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#d0d0e0;margin:0;padding:30px 20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{max-width:480px;width:100%;background:#131320;border:1px solid #2a2a3a;border-radius:12px;padding:40px;box-shadow:0 4px 24px rgba(0,0,0,.3);text-align:center}
h2{margin:0 0 8px;color:#f0c060;font-size:22px}
.sub{color:#888;font-size:14px;margin-bottom:28px}
#btn{display:inline-block;padding:18px 40px;background:#5b8aff;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;font-family:'Segoe UI',Arial,sans-serif;transition:background .15s}
#btn:hover{background:#4a79ee}
#result{margin-top:28px;font-size:15px;line-height:1.7;min-height:48px}
.pass{color:#4caf50;font-weight:700}.fail{color:#f44336;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h2>&#128203; Quick Clipboard Check</h2>
  <div class="sub">One click — tells you if the bookmarklets will work on this computer.</div>
  <button id="btn" onclick="runCheck()">Run Check</button>
  <div id="result"></div>
</div>
<script>
async function runCheck(){
  var btn=document.getElementById('btn'),res=document.getElementById('result');
  btn.disabled=true;btn.textContent='Checking...';
  res.innerHTML='';
  // Simulate the same async delay as pdf.js load + parse
  await new Promise(function(r){setTimeout(r,3000)});
  var text='CLIPBOARD_CHECK_'+Date.now();
  var method='';
  // Same fallback chain as the bookmarklets
  try{await navigator.clipboard.writeText(text);method='clipboard-api'}catch(e){}
  if(!method){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(ta);ta.select();if(document.execCommand('copy'))method='execCommand';document.body.removeChild(ta)}catch(e2){}}
  btn.disabled=false;btn.textContent='Run Check';
  if(method){
    res.innerHTML='<span class="pass">&#9989; All good! The bookmarklets will work on this browser.</span>';
  }else{
    res.innerHTML='<span class="fail">&#10060; Clipboard is blocked on this browser.</span><br><br>Show this screen to Dan.';
  }
}
</script>
</body>
</html>
